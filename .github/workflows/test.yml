name: test

on:
  push:
    branches: [main]
  pull_request:
  # Figma Desktop, npm and Node all move underneath this project; a green run
  # weeks after the last commit is worth more than one only on push.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum on the inexpensive Linux runner, cover both
        # active LTS lines there, and exercise OS-specific daemon behaviour on
        # the current LTS. This avoids a redundant full Cartesian product.
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  architecture-latency:
    name: architecture latency budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Wall-clock budgets need an otherwise idle Node process. Running this
      # inside `node --test` lets parallel test files create false regressions.
      - run: npm run check:architecture-latency

  pack:
    name: tarball contains the runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # packaging.test.js checks package.json's `files` list; this checks what
      # npm actually packs, which is the thing users install.
      - name: pack and verify the plugin ships
        run: |
          npm pack --silent
          tar -tzf figma-bridge-mcp-*.tgz > files.txt
          for f in package/plugin/manifest.json package/plugin/code.js package/plugin/ui.html \
                   package/src/server.js package/engine/src/daemon.js \
                   package/engine/src/lib/plugin-handshake.js \
                   package/engine/src/commands/slides.js package/README.md \
                   package/.codex-plugin/plugin.json package/.claude-plugin/plugin.json \
                   package/.claude-plugin/marketplace.json \
                   package/.mcp.json package/plugin.json package/mcp.json \
                   package/skills/figma-bridge-design-to-code/SKILL.md \
                   package/skills/figma-bridge-code-to-figma/SKILL.md \
                   package/skills/figma-bridge-component-library/SKILL.md \
                   package/SECURITY.md package/CHANGELOG.md package/NOTICE \
                   package/LICENSE package/engine/LICENSE; do
            grep -qx "$f" files.txt || { echo "MISSING from tarball: $f"; exit 1; }
          done
          if grep -Eq '^package/(docs/|evals/|scripts/|tests/|CONTEXT\.md$|CONTRIBUTING\.md$|SUPPORT\.md$)' files.txt; then
            echo "Repository-only material leaked into the npm tarball"
            exit 1
          fi
          echo "tarball contents verified"
      - name: install the tarball and start its packaged engine
        run: |
          mkdir package-smoke
          npm install --prefix package-smoke ./figma-bridge-mcp-*.tgz
          node scripts/smoke-mcp-server.js package-smoke/node_modules/.bin/figma-bridge-mcp
          node package-smoke/node_modules/figma-bridge-mcp/engine/src/index.js --help
