name: test

on:
  push:
    branches: [main]
  pull_request:
  # Figma Desktop, npm and Node all move underneath this project; a green run
  # weeks after the last commit is worth more than one only on push.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  public-safety:
    name: no private material in Git history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check:public-safety:history

  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared minimum on the inexpensive Linux runner, cover both
        # active LTS lines there, and exercise OS-specific daemon behaviour on
        # the current LTS. This avoids a redundant full Cartesian product.
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      # Node's test runner gives every test file its own process. Asset Export
      # then creates bounded publication Workers inside that process. A current
      # Windows runner terminated one such file without a JavaScript exception
      # under parallel scheduling, so Windows removes that cross-file process
      # fan-out while retaining the same suite and per-file process isolation.
      - if: runner.os == 'Windows'
        run: npm test -- --test-concurrency=1
      - if: runner.os != 'Windows'
        run: npm test

  architecture-latency:
    name: architecture latency budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      # Wall-clock budgets need an otherwise idle Node process. Running this
      # inside `node --test` lets parallel test files create false regressions.
      - run: npm run check:architecture-latency

  runtime-audit:
    name: published runtime has no known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` audits on its own by default; that call went to the retiring
      # quick-audit endpoint and stalled for five minutes on 2026-09-04. The
      # explicit audit below is the one check this job exists for.
      - run: npm ci --ignore-scripts --no-audit
      # Keep this network-backed check separate from `npm test`: contributors
      # can run the deterministic suite offline, while CI and releases still
      # fail on any advisory in the package users actually install.
      - run: npm run check:audit
      # Development-only advisories stay visible for triage, but do not create
      # false release blockers unless they affect a tool our build executes.
      - name: report development dependency advisories
        continue-on-error: true
        run: npm run check:audit:development

  pack:
    name: tarball contains the runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Exercise the installed tarball on the declared runtime floor, not
          # only against the newer Node used to publish it.
          node-version: 18
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      # The release gate compares the complete inventory to a reviewed
      # allowlist, rejects new executable bits, and requires two identical packs.
      - name: build independently verifiable package
        run: npm run build:package-artifact -- --output-dir release-artifact
      - name: install the tarball and start its packaged engine
        run: |
          mkdir package-smoke
          npm install --prefix package-smoke ./release-artifact/package.tgz --ignore-scripts --no-audit --engine-strict
          node scripts/smoke-mcp-server.js package-smoke/node_modules/.bin/figma-bridge-mcp package-smoke/node_modules/figma-bridge-mcp/engine/src/index.js
          node package-smoke/node_modules/figma-bridge-mcp/engine/src/index.js --help
      - name: verify the installed production dependency graph
        run: |
          npm audit --prefix package-smoke --omit=dev
          node scripts/write-installed-dependency-evidence.js package-smoke release-artifact/dependencies.json
      - name: retain package integrity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
