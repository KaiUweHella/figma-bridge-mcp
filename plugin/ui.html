<!DOCTYPE html>
<html>
<head>
  <style>
    /* Palette in OKLCH: perceptually even steps, every foreground/background
       pair below verified >= 4.5:1. One accent hue (185, the Figma Bridge teal)
       carries brand AND "connected"; amber and red are the only other hues,
       each with exactly one meaning. */
    :root {
      --bg:         oklch(0.215 0 0);
      --surface:    oklch(0.255 0 0);
      --raised:     oklch(0.295 0 0);
      --line:       oklch(0.355 0 0);
      --text:       oklch(0.965 0 0);
      --dim:        oklch(0.780 0 0);
      --faint:      oklch(0.700 0 0);
      --accent:     oklch(0.800 0.110 185);
      --accent-ink: oklch(0.250 0.030 185);
      --warn:       oklch(0.790 0.150 75);
      --danger:     oklch(0.700 0.180 25);

      /* Type scale — four steps, nothing below 10px. */
      --fs-title: 12px;
      --fs-body:  11px;
      --fs-meta:  10px;
      --fs-mono:  11px;

      --r-card: 10px;   /* inner radius + padding stays concentric */
      --r-ctl:  6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: var(--fs-body);
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100%;
      /* The panel is a fixed-size iframe: without this, an opened section is
         clipped with no way to reach it. */
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }
    /* No child may be squashed to buy room: the selection strip collapsed to
       0px and the error text was sliced mid-line whenever content overflowed.
       Overflow is the scroll container's job, not the children's. */
    body > * { flex: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
    .row { display: flex; align-items: center; gap: 8px; }

    /* --- Identity bar --------------------------------------------------- */
    .topbar { display: flex; align-items: center; gap: 7px; }
    .mark {
      width: 12px; height: 12px; flex: none; border-radius: 3px;
      background: var(--accent);
      /* Notch cut out of the square: a bracket — the bridge's mark. */
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 70%, 55% 70%, 55% 30%, 0 30%);
    }
    .wordmark { font-size: var(--fs-title); font-weight: 600; letter-spacing: 0.01em; }
    .meta {
      margin-left: auto; font-size: var(--fs-meta); color: var(--faint);
      font-variant-numeric: tabular-nums;
    }

    /* --- Status card ---------------------------------------------------- */
    .card {
      display: flex; gap: 9px; align-items: flex-start;
      background: var(--surface);
      border-radius: var(--r-card);
      padding: 10px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: var(--faint); margin-top: 4px;
    }
    .dot.connecting { background: var(--warn); }
    .dot.connected  { background: var(--accent); }
    .dot.error      { background: var(--danger); }
    .dot.paused     { background: var(--warn); }
    @media (prefers-reduced-motion: no-preference) {
      .dot.connecting { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    }
    #status { font-weight: 500; }
    .hint { font-size: var(--fs-meta); color: var(--faint); }
    .hint.warn { color: var(--warn); }

    /* --- Context strips ------------------------------------------------- */
    #selInfo {
      display: none; font-size: var(--fs-meta); color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-inline-start: 2px;
    }
    #selInfo.show { display: block; }
    #selInfo b { color: var(--accent); font-weight: 500; }
    #lastError {
      display: none; font-size: var(--fs-meta); color: var(--danger);
      background: color-mix(in oklab, var(--danger) 12%, var(--surface));
      border-radius: var(--r-ctl); padding: 6px 8px; word-break: break-word;
      /* Exactly three lines, so the cut lands between lines instead of
         through one. The rest stays reachable by scrolling. */
      line-height: 1.4; max-height: 4.2em; overflow-y: auto;
    }
    #lastError.show { display: block; }

    /* --- Controls ------------------------------------------------------- */
    button {
      font: inherit; font-size: var(--fs-meta); font-weight: 500;
      padding: 7px 10px; border-radius: var(--r-ctl); cursor: pointer;
      border: 1px solid var(--line); background: var(--raised); color: var(--text);
      transition: background-color 120ms ease-out, border-color 120ms ease-out, scale 120ms ease-out;
    }
    button:hover { background: color-mix(in oklab, var(--raised) 80%, var(--text)); }
    button:active { scale: 0.96; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { scale: 1; } }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .actions button.active {
      background: color-mix(in oklab, var(--warn) 22%, var(--surface));
      border-color: var(--warn); color: var(--warn);
    }
    button.primary {
      background: var(--accent); color: var(--accent-ink);
      border-color: transparent; font-weight: 600; font-size: var(--fs-body);
    }
    button.primary:hover { background: color-mix(in oklab, var(--accent) 88%, white); }
    button.ghost { background: none; border-color: transparent; color: var(--dim); }
    button.ghost:hover { background: var(--raised); color: var(--text); }
    button.wide { width: 100%; }

    /* --- Disclosure sections -------------------------------------------- */
    .section { display: flex; flex-direction: column; gap: 8px; }
    .disclosure {
      display: flex; align-items: center; gap: 6px; width: 100%;
      background: none; border: none; padding: 4px 2px; color: var(--dim);
      font-size: var(--fs-meta); font-weight: 500; text-align: start;
    }
    .disclosure:hover { background: none; color: var(--text); }
    .chev {
      display: inline-block; color: var(--faint); font-size: 12px; line-height: 1;
      transition: rotate 140ms ease-out;
    }
    .disclosure[aria-expanded="true"] .chev { rotate: 90deg; }
    @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
    .disclosure .trail { margin-inline-start: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
    .tag {
      font-size: 9px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px;
    }
    .tag.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }

    /* --- Activity log ---------------------------------------------------- */
    #log {
      /* Fixed height, not flex: the panel measures itself to ask the host for
         a size, and a stretching child would make that measurement circular. */
      display: none; height: 170px; overflow-y: auto;
      background: var(--surface); border-radius: var(--r-ctl);
      padding: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: var(--fs-mono); line-height: 1.6;
    }
    #log.show { display: block; }
    #log:empty::after { content: 'Nothing yet — agent commands appear here as they run.'; color: var(--faint); font-family: Inter, sans-serif; font-size: var(--fs-meta); }
    .logline { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logline .t { color: var(--faint); font-variant-numeric: tabular-nums; }
    .logline.write { color: var(--warn); }
    .logline.err   { color: var(--danger); }
    .logline.meta  { color: var(--accent); }

    /* --- Setup ----------------------------------------------------------- */
    .panel { display: none; flex-direction: column; gap: 14px; }
    .panel.show { display: flex; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.attention {
      background: color-mix(in oklab, var(--warn) 10%, var(--surface));
      border-radius: var(--r-ctl); padding: 8px; margin: -8px;
    }
    label { font-size: var(--fs-body); font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 6px; }
    input {
      width: 100%; padding: 7px 8px; border-radius: var(--r-ctl);
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-mono);
    }
    input::placeholder { color: var(--faint); }
    input:focus-visible { border-color: var(--accent); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="mark" aria-hidden="true"></span>
    <h1 class="wordmark">Figma Bridge</h1>
    <span id="connMeta" class="meta"></span>
  </header>

  <!-- The one thing this window exists to answer: can the agent reach Figma?
       Status and its explanation live together, announced as one region. -->
  <div class="card">
    <span id="dot" class="dot connecting" aria-hidden="true"></span>
    <div role="status" aria-live="polite">
      <div id="status">Starting…</div>
      <div id="hint" class="hint">Keep this window open while working.</div>
    </div>
  </div>

  <div id="selInfo"></div>
  <div id="lastError" role="alert"></div>

  <div class="actions">
    <button id="pauseBtn" type="button">Pause agent</button>
    <button id="saveVersionBtn" type="button">Save version</button>
  </div>

  <section class="section">
    <button id="logBtn" class="disclosure" type="button" aria-expanded="false" aria-controls="log">
      <span class="chev" aria-hidden="true">›</span>Activity
      <span id="stats" class="trail"></span>
    </button>
    <div id="log" tabindex="0" role="log" aria-label="Agent activity"></div>
  </section>

  <section class="section">
    <button id="setupBtn" class="disclosure" type="button" aria-expanded="false" aria-controls="setupPanel">
      <span class="chev" aria-hidden="true">›</span>Setup
      <span id="restTag" class="tag">REST off</span>
    </button>
    <div id="setupPanel" class="panel">
      <div class="field" id="keyPanel">
        <label for="keyInput">Access key</label>
        <p class="hint">Shown by <code>figma_connect</code>. Stored in this plugin, reused every session.</p>
        <input id="keyInput" type="text" spellcheck="false" autocomplete="off" placeholder="paste key here" />
        <button id="saveBtn" class="primary" type="button">Save &amp; connect</button>
      </div>
      <div class="field">
        <label for="restInput">Figma REST token <span class="tag">optional</span></label>
        <p class="hint">A personal access token unlocks version history, comments and library docs. Stored only on this machine.</p>
        <input id="restInput" type="password" spellcheck="false" autocomplete="off" placeholder="figd_1a2b3c…" />
        <div class="row">
          <button id="restSaveBtn" type="button">Save token</button>
          <button id="restClearBtn" class="ghost" type="button">Clear token</button>
        </div>
        <p id="restStatus" class="hint"></p>
      </div>
    </div>
  </section>

  <button id="reconnectBtn" class="wide" type="button" hidden>Reconnect this window</button>

  <script>
    // ============ Handshake crypto ============
    // The daemon and this panel authenticate each other with HMAC-SHA256 over a
    // shared transcript (see engine/src/lib/plugin-handshake.js — the string
    // format below MUST match it; tests/plugin-handshake.test.js enforces that).
    //
    // SHA-256 is implemented here in plain JS rather than via crypto.subtle:
    // the plugin UI runs in a sandboxed null-origin iframe, and WebCrypto is
    // gated on secure-context inheritance we do not control. A silent fallback
    // to a weaker scheme would be the worst outcome for an auth handshake, so
    // the primitive ships with us and always behaves the same.
    const HANDSHAKE_PROTO = 2;
    const HANDSHAKE_PREFIX = 'figma-bridge-mcp/handshake/v2';
    // Signed as part of the transcript, so a version claim cannot be swapped
    // in flight. Bumped to 3 with the challenge-response handshake.
    const PLUGIN_VERSION = '3.0.0';

    const SHA_K = new Uint32Array([
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2,
    ]);
    const rotr = (x, n) => ((x >>> n) | (x << (32 - n))) >>> 0;

    function sha256(bytes) {
      const H = new Uint32Array([
        0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19,
      ]);
      const len = bytes.length;
      const padded = new Uint8Array((((len + 9 + 63) / 64) | 0) * 64);
      padded.set(bytes);
      padded[len] = 0x80;
      const dv = new DataView(padded.buffer);
      const bits = len * 8;
      dv.setUint32(padded.length - 8, Math.floor(bits / 0x100000000));
      dv.setUint32(padded.length - 4, bits >>> 0);

      const w = new Uint32Array(64);
      for (let off = 0; off < padded.length; off += 64) {
        for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
        for (let i = 16; i < 64; i++) {
          const a0 = w[i - 15], a1 = w[i - 2];
          const s0 = (rotr(a0, 7) ^ rotr(a0, 18) ^ (a0 >>> 3)) >>> 0;
          const s1 = (rotr(a1, 17) ^ rotr(a1, 19) ^ (a1 >>> 10)) >>> 0;
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
        }
        let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
        for (let i = 0; i < 64; i++) {
          const S1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
          const ch = ((e & f) ^ (~e & g)) >>> 0;
          const t1 = (h + S1 + ch + SHA_K[i] + w[i]) >>> 0;
          const S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
          const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
          const t2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + t1) >>> 0;
          d = c; c = b; b = a; a = (t1 + t2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }
      const out = new Uint8Array(32);
      const odv = new DataView(out.buffer);
      for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
      return out;
    }

    function toHex(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
      return s;
    }

    function hmacSha256Hex(keyStr, msgStr) {
      const enc = new TextEncoder();
      let k = enc.encode(keyStr);
      if (k.length > 64) k = sha256(k);
      const ipad = new Uint8Array(64), opad = new Uint8Array(64);
      for (let i = 0; i < 64; i++) {
        const kb = i < k.length ? k[i] : 0;
        ipad[i] = kb ^ 0x36;
        opad[i] = kb ^ 0x5c;
      }
      const m = enc.encode(msgStr);
      const inner = new Uint8Array(64 + m.length);
      inner.set(ipad); inner.set(m, 64);
      const ih = sha256(inner);
      const outer = new Uint8Array(96);
      outer.set(opad); outer.set(ih, 64);
      return toHex(sha256(outer));
    }

    // Weak randomness in an auth handshake is worse than a visible failure —
    // no Math.random fallback.
    function makeNonce() {
      if (!(window.crypto && window.crypto.getRandomValues)) {
        throw new Error('This browser has no secure random source');
      }
      return toHex(window.crypto.getRandomValues(new Uint8Array(32)));
    }

    // Length-independent compare so a wrong daemon proof leaks no prefix.
    function proofEquals(a, b) {
      if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
      let diff = 0;
      for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
      return diff === 0;
    }

    const PORTS = [3456, 3457, 3458, 3459, 3460];
    let ws = null;
    let reconnectTimer = null;
    let activeScan = null;
    let keepaliveTimer = null;
    let lastPong = Date.now();
    let lastPingSent = 0;
    let latencyMs = null;
    let connectedPort = null;
    let KEY = null;              // access key, once known — never sent, only used as an HMAC secret
    let authed = false;          // BOTH sides proved themselves on the current socket
    let pendingNonce = null;     // our nonce for the in-flight handshake
    let pendingChallenge = null; // the daemon's nonce + port for the in-flight handshake

    // Scan generation: every new scan (and every teardown) invalidates all
    // callbacks of older scans. Without this, two overlapping scans could BOTH
    // produce an authenticated socket — the daemon then holds one while our
    // global `ws` points at the other, and the orphan leaks.
    let scanGen = 0;

    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const connMetaEl = document.getElementById('connMeta');
    const keyPanel = document.getElementById('keyPanel');
    const keyInput = document.getElementById('keyInput');
    const saveBtn = document.getElementById('saveBtn');
    const setupBtn = document.getElementById('setupBtn');
    const setupPanel = document.getElementById('setupPanel');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const hintEl = document.getElementById('hint');
    const pauseBtn = document.getElementById('pauseBtn');
    const selInfoEl = document.getElementById('selInfo');
    const saveVersionBtn = document.getElementById('saveVersionBtn');
    const logBtn = document.getElementById('logBtn');
    const statsEl = document.getElementById('stats');
    const lastErrorEl = document.getElementById('lastError');
    const logEl = document.getElementById('log');

    // Daemon-unreachable detection: endless "Scanning…" tells the user
    // nothing. After a few failed scan rounds we name the problem, say what
    // to do, and keep retrying quietly at a slower pace.
    const DEFAULT_HINT = 'Keep this window open while working.';
    const UNREACHABLE_AFTER_SCANS = 4;
    const PORT_SCAN_TIMEOUT_MS = 750;    // fallback for sockets that stay pending
    let failedScans = 0;
    let unreachableNotified = false;

    function setStatus(text, state) {
      statusEl.textContent = text;
      dotEl.className = 'dot ' + state;
    }
    function setConnMeta() {
      if (!connectedPort) { connMetaEl.textContent = ''; return; }
      connMetaEl.textContent = ':' + connectedPort + (latencyMs !== null ? ' · ' + latencyMs + 'ms' : '');
    }
    // The panel is a fixed iframe, so every disclosure has to buy its own
    // room — otherwise an opened section is clipped with no way to scroll to
    // it. One place computes the size; both toggles call it.
    let logOpen = false;
    let setupOpen = false;
    const PANEL_WIDTH = 360;
    const BODY_PAD = 12;
    // Measure the laid-out content instead of hard-coding a height per state:
    // hard-coded numbers drift the moment a string wraps to another line, and
    // the clipped control is never the one you were looking at.
    function syncSize() {
      requestAnimationFrame(() => {
        let bottom = 0;
        for (const el of document.body.children) {
          if (el.hidden || getComputedStyle(el).display === 'none') continue;
          bottom = Math.max(bottom, el.getBoundingClientRect().bottom + window.scrollY);
        }
        const height = Math.ceil(bottom) + BODY_PAD;
        parent.postMessage({ pluginMessage: { type: 'resize', width: PANEL_WIDTH, height } }, '*');
      });
    }
    function setSetupOpen(open) {
      setupOpen = open;
      setupPanel.classList.toggle('show', open);
      setupBtn.setAttribute('aria-expanded', String(open));
      // Show the key that is actually in use, so "is this the right one?" is
      // answerable without a round trip to the terminal.
      if (open && KEY && !keyInput.value) keyInput.value = KEY;
      syncSize();
    }
    setupBtn.onclick = () => setSetupOpen(!setupOpen);

    // Called when the key is missing or rejected: open Setup, mark the field,
    // and put the cursor in it. Never auto-closes — the user may have opened
    // Setup deliberately.
    function showKeyPanel(show) {
      keyPanel.classList.toggle('attention', show);
      if (show) {
        if (!setupOpen) setSetupOpen(true);
        keyInput.focus();
      }
    }

    // ============ Activity log (feature A) ============
    // Every eval already flows through this iframe — record it instead of
    // discarding it. Ring buffer, newest on top.
    const LOG_MAX = 50;
    const logEntries = [];       // {id, t0, label, kind: 'read'|'write'|'meta', status, ms}
    let okCount = 0, errCount = 0;

    const WRITE_RE = /\b(create[A-Z]\w*|\.remove\s*\(|appendChild|insertChild|setProperties|resize\s*\(|saveVersionHistoryAsync)\b|\.\w+\s*=[^=]/;
    const API_RE = /figma\.((?:\w+\.)*\w+)\s*\(/;
    const NODE_ID_RE = /\b\d+:\d+\b/g;

    function evalLabel(code) {
      const api = API_RE.exec(code);
      const ids = new Set((code.match(NODE_ID_RE) || []));
      let label = api ? api[1] + '()' : 'eval';
      if (ids.size) label += ' · ' + ids.size + ' node' + (ids.size > 1 ? 's' : '');
      return label;
    }

    function addLog(entry) {
      logEntries.unshift(entry);
      if (logEntries.length > LOG_MAX) logEntries.pop();
      renderLog();
    }
    function finishLog(id, error, batchInfo) {
      const e = logEntries.find(x => x.id === id && !x.status);
      if (!e) return;
      e.ms = Date.now() - e.t0;
      e.status = error ? 'err' : 'ok';
      if (batchInfo) e.label += ' — ' + batchInfo;
      if (error) { errCount++; showError(error); } else { okCount++; }
      renderStats();
      renderLog();
    }
    function renderStats() {
      statsEl.textContent = okCount + errCount
        ? okCount + ' ok · ' + errCount + ' failed'
        : '';
    }
    function showError(text) {
      const wasHidden = !lastErrorEl.classList.contains('show');
      lastErrorEl.textContent = String(text);
      lastErrorEl.classList.add('show');
      if (wasHidden) syncSize();
    }
    function fmtTime(t) {
      const d = new Date(t);
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
    }
    function renderLog() {
      if (!logOpen) return;
      logEl.innerHTML = '';
      for (const e of logEntries) {
        const div = document.createElement('div');
        div.className = 'logline ' + (e.status === 'err' ? 'err' : e.kind);
        const mark = e.status === 'err' ? '✗' : (e.status === 'ok' ? '✓' : '…');
        const ms = e.ms !== undefined ? ' (' + e.ms + 'ms)' : '';
        div.textContent = mark + ' ' + e.label + ms;
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = '  ' + fmtTime(e.t0);
        div.appendChild(t);
        div.title = e.label;
        logEl.appendChild(div);
      }
    }

    logBtn.onclick = () => {
      logOpen = !logOpen;
      logEl.classList.toggle('show', logOpen);
      logBtn.setAttribute('aria-expanded', String(logOpen));
      syncSize();
      renderLog();
    };

    // ============ Pause / kill switch (feature B) ============
    let paused = false;
    pauseBtn.onclick = () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume agent' : 'Pause agent';
      pauseBtn.classList.toggle('active', paused);
      if (paused) {
        setStatus('Paused', 'paused');
        hintEl.textContent = 'Agent commands are being rejected. Press Resume to continue.';
      } else if (authed) {
        setStatus('Connected', 'connected');
        hintEl.textContent = DEFAULT_HINT;
      }
    };
    function rejectPaused(msg) {
      const error = 'Paused by user in the Figma Bridge plugin UI — press Resume there to continue.';
      const reply = msg.action === 'eval-batch'
        ? { type: 'batch-result', id: msg.id, results: (msg.codes || []).map(() => ({ success: false, error })) }
        : { type: 'result', id: msg.id, error };
      try { ws.send(JSON.stringify(reply)); } catch (e) {}
      addLog({ id: msg.id, t0: Date.now(), label: 'rejected (paused)', kind: 'meta', status: 'err', ms: 0 });
      errCount++; renderStats();
    }

    // ============ Superseded state ============
    // Two Figma windows, last hello wins: the daemon keeps ONE plugin socket.
    // When another window takes over, it notifies this one (message + close
    // 4409). Without this state the displaced window stayed green while every
    // eval silently went elsewhere. No auto-reconnect — that would just
    // supersede the other window back in an endless tug-of-war; the user
    // decides via the button.
    let superseded = false;
    function onSuperseded() {
      if (superseded) return;
      superseded = true;
      teardown();
      setStatus('Another Figma window took over', 'error');
      hintEl.textContent = 'This window no longer receives agent commands. Use "Reconnect this window" to take back over.';
      hintEl.classList.add('warn');
      reconnectBtn.hidden = false;
      syncSize();
      parent.postMessage({ pluginMessage: { type: 'superseded' } }, '*');
    }
    reconnectBtn.onclick = () => {
      superseded = false;
      reconnectBtn.hidden = true;
      syncSize();
      hintEl.textContent = DEFAULT_HINT;
      hintEl.classList.remove('warn');
      connectParallel();
    };

    // ============ Selection display (feature C) ============
    // Selection changes arrive automatically from code.js (debounced
    // selectionchange). Shown here so the user SEES what the agent sees; no
    // button — the push happens on its own.
    function renderSelection(sel) {
      const nodes = (sel && sel.nodes) || [];
      const wasShown = selInfoEl.classList.contains('show');
      if (!nodes.length) {
        selInfoEl.classList.remove('show');
        selInfoEl.textContent = '';
        if (wasShown) syncSize();
        return;
      }
      const first = nodes[0];
      const size = first.width !== undefined ? ' ' + first.width + '×' + first.height : '';
      const more = sel.total > 1 ? ' +' + (sel.total - 1) + ' more' : '';
      selInfoEl.textContent = '';
      const label = document.createElement('b');
      label.textContent = 'Agent sees: ';
      selInfoEl.append(label, first.name + ' (' + first.type + size + ')' + more);
      selInfoEl.title = first.name + ' (' + first.type + size + ')' + more;
      selInfoEl.classList.add('show');
      if (!wasShown) syncSize();
    }

    // ============ Save version (feature D) ============
    // Named entry in Figma's own version history — the restore point for the
    // agent's writes, which are otherwise not undoable from here.
    saveVersionBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'save-version' } }, '*');
      addLog({ id: 'v' + Date.now(), t0: Date.now(), label: 'saving version…', kind: 'meta', status: 'ok', ms: 0 });
    };

    // --- Access-key bootstrap: ask code.js (clientStorage lives there) ---
    function requestKey() {
      parent.postMessage({ pluginMessage: { type: 'get-key' } }, '*');
    }

    saveBtn.onclick = () => {
      const val = keyInput.value.trim();
      if (!val) { setStatus('Enter a key first', 'error'); return; }
      KEY = val;
      parent.postMessage({ pluginMessage: { type: 'save-key', value: val } }, '*');
      showKeyPanel(false);
      // (Re)connect with the new key.
      teardown();
      connectParallel();
    };

    // ============ Optional Figma REST token (PAT) ============
    // Pasted here (never into chat or the MCP client config), sent over the
    // authenticated socket; the daemon persists it 0600. The UI only ever
    // learns WHETHER a token is stored (hello-ack / rest-token-ack), never
    // the value — the input always stays empty.
    const restTag = document.getElementById('restTag');
    const restInput = document.getElementById('restInput');
    const restSaveBtn = document.getElementById('restSaveBtn');
    const restClearBtn = document.getElementById('restClearBtn');
    const restStatusEl = document.getElementById('restStatus');
    let restConfigured = false;

    function renderRestStatus() {
      restStatusEl.textContent = restConfigured
        ? 'Token stored on this machine (~/.figma-bridge-mcp/rest-token).'
        : 'No token set — version history, comments and library docs stay off.';
      restTag.textContent = restConfigured ? 'REST on' : 'REST off';
      restTag.classList.toggle('on', restConfigured);
    }
    function sendRestToken(value) {
      if (!(ws && ws.readyState === WebSocket.OPEN && authed)) {
        restStatusEl.textContent = 'Connect first — the token travels over the authenticated connection.';
        return;
      }
      ws.send(JSON.stringify({ type: 'rest-token', value }));
    }
    restSaveBtn.onclick = () => {
      const val = restInput.value.trim();
      if (!val) { restStatusEl.textContent = 'Paste a token first, or use Clear token to remove the stored one.'; return; }
      sendRestToken(val);
      restInput.value = '';
    };
    restClearBtn.onclick = () => {
      restInput.value = '';
      sendRestToken('');
    };

    function teardown() {
      scanGen++; // invalidate any in-flight port scan
      stopKeepalive();
      clearTimeout(reconnectTimer);
      if (activeScan) { activeScan.cancel(); activeScan = null; }
      if (ws) {
        try { ws.onclose = null; ws.onerror = null; ws.close(); } catch (e) {}
        ws = null;
      }
      authed = false;
      pendingNonce = null;
      pendingChallenge = null;
      connectedPort = null;
      latencyMs = null;
      setConnMeta();
    }

    // One scan round. A refused localhost connection reports error/close almost
    // immediately; waiting for the fallback timeout after ALL ports have
    // already refused made reconnects feel several seconds slower than they
    // were. Keep the timeout only for the rare socket that stays pending.
    // This function is deliberately dependency-injected so the shipped plugin
    // algorithm itself can be regression-tested outside Figma.
    function scanPorts({
      ports,
      WebSocketCtor,
      timeoutMs,
      isCurrent,
      onOpen,
      onExhausted,
      setTimer = setTimeout,
      clearTimer = clearTimeout,
    }) {
      let done = false;
      let constructionDone = false;
      let fallbackTimer = null;
      const sockets = [];
      const settled = new Set();

      function closeSocket(socket) {
        socket.onopen = null;
        socket.onclose = null;
        socket.onerror = null;
        try { socket.close(); } catch (e) {}
      }

      function finishExhausted(force) {
        if (done || !constructionDone || !isCurrent()) return;
        if (!force && settled.size < sockets.length) return;
        done = true;
        if (fallbackTimer !== null) clearTimer(fallbackTimer);
        sockets.forEach(closeSocket);
        onExhausted();
      }

      function markSettled(socket) {
        settled.add(socket); // error + close is one failed attempt, not two
        finishExhausted(false);
      }

      for (const port of ports) {
        const url = `ws://localhost:${port}/plugin`;
        try {
          const socket = new WebSocketCtor(url);
          sockets.push(socket);
          socket.onopen = () => {
            if (done || !isCurrent()) { closeSocket(socket); return; }
            done = true;
            if (fallbackTimer !== null) clearTimer(fallbackTimer);
            for (const other of sockets) {
              if (other !== socket) closeSocket(other);
            }
            socket.onopen = null;
            socket.onclose = null;
            socket.onerror = null;
            onOpen(socket, port);
          };
          socket.onerror = () => markSettled(socket);
          socket.onclose = () => markSettled(socket);
        } catch (e) {
          // A constructor rejection is already a settled port. No socket needs
          // cleanup, and the completed loop below can exhaust immediately.
        }
      }

      constructionDone = true;
      if (sockets.length === 0 || settled.size === sockets.length) {
        finishExhausted(false);
      } else if (!done) {
        fallbackTimer = setTimer(() => finishExhausted(true), timeoutMs);
      }

      return {
        cancel() {
          if (done) return;
          done = true;
          if (fallbackTimer !== null) clearTimer(fallbackTimer);
          sockets.forEach(closeSocket);
        },
      };
    }

    function reconnectDelay(scanFailures) {
      // Fast while a daemon restart is in flight; still light enough in the
      // long-running unreachable state (5 loopback ports every 500ms).
      return scanFailures >= UNREACHABLE_AFTER_SCANS ? 500 : 120;
    }

    // Try all ports in parallel, use first socket that opens.
    function connectParallel() {
      if (!KEY) { showKeyPanel(true); setStatus('Access key required', 'error'); return; }
      if (ws && ws.readyState === WebSocket.OPEN) return;

      // Starting a new scan invalidates all callbacks of any previous scan —
      // an overlapping scan can no longer produce a second winner socket.
      const gen = ++scanGen;

      // Once we've declared the daemon unreachable, keep that message on
      // screen instead of flickering back to "Scanning…" on every retry.
      if (failedScans < UNREACHABLE_AFTER_SCANS) setStatus('Scanning…', 'connecting');
      activeScan = scanPorts({
        ports: PORTS,
        WebSocketCtor: WebSocket,
        timeoutMs: PORT_SCAN_TIMEOUT_MS,
        isCurrent: () => gen === scanGen,
        onOpen(socket, port) {
          activeScan = null;
          ws = socket;
          authed = false;
          superseded = false;
          reconnectBtn.hidden = true;
          failedScans = 0;
          unreachableNotified = false;
          connectedPort = port;
          setConnMeta();
          hintEl.textContent = DEFAULT_HINT;
          hintEl.classList.remove('warn');

          ws.onmessage = handleMessage;
          ws.onclose = handleClose;
          ws.onerror = handleClose;

          setStatus('Authenticating…', 'connecting');
          // The DAEMON speaks first now: it sends {type:'challenge'} and we
          // answer with a proof. Nothing is sent until then — the access key
          // must never appear on a socket we have not authenticated.
          pendingNonce = null;
          pendingChallenge = null;
        },
        onExhausted() {
          activeScan = null;
          clearTimeout(reconnectTimer);
          failedScans++;
          if (failedScans >= UNREACHABLE_AFTER_SCANS) {
            setStatus('Daemon not reachable', 'error');
            hintEl.textContent = 'Start it from Claude with figma_connect. Reconnects automatically.';
            if (!unreachableNotified) {
              unreachableNotified = true;
              parent.postMessage({ pluginMessage: { type: 'daemon-unreachable' } }, '*');
            }
          }
          reconnectTimer = setTimeout(connectParallel, reconnectDelay(failedScans));
        },
      });
    }

    function authFailureText(reason) {
      if (reason === 'no-key-configured') {
        return {
          status: 'Daemon has no access key',
          hint: 'The daemon started without a key file. Run figma_connect (it restarts the daemon with your key) — re-entering the key here will NOT help.',
          showPanel: false,
        };
      }
      if (reason === 'timeout') {
        return {
          status: 'Auth handshake timed out',
          hint: 'The challenge reply took too long. Reconnecting…',
          showPanel: false,
        };
      }
      if (reason === 'proto-mismatch') {
        return {
          status: 'Plugin and daemon disagree on the handshake',
          hint: 'This plugin build is out of step with the running daemon. Run figma_connect (it refreshes the plugin files), then close and reopen Figma Bridge here.',
          showPanel: false,
        };
      }
      if (reason === 'daemon-proof') {
        return {
          status: 'The daemon could not prove itself',
          hint: 'Whatever answered on that port does not hold your access key — nothing was sent to it. Run figma_connect to restart the real daemon, and check what else is listening on 3456–3460.',
          showPanel: false,
        };
      }
      if (reason === 'no-random') {
        return {
          status: 'No secure random source',
          hint: 'This Figma build cannot generate handshake nonces. Please report it — connecting without them would weaken the pairing.',
          showPanel: false,
        };
      }
      return {
        status: 'Access key rejected',
        hint: 'Re-enter the key shown by figma_connect / figma_pairing.',
        showPanel: true,
      };
    }
    function onAuthFailure(reason) {
      authed = false;
      const t = authFailureText(reason);
      setStatus(t.status, 'error');
      hintEl.textContent = t.hint;
      hintEl.classList.add('warn');
      parent.postMessage({ pluginMessage: { type: 'auth-error', reason: reason || 'invalid-key' } }, '*');
      teardown();
      if (t.showPanel) {
        showKeyPanel(true);
      } else if (reason === 'timeout') {
        reconnectTimer = setTimeout(connectParallel, 1000);
      }
      // no-key-configured: stay put — reconnecting is pointless until the
      // daemon is restarted with a key; the user was told what to run.
    }

    function handleMessage(event) {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }

      // --- Handshake step 1: the daemon's challenge ---
      if (msg.type === 'challenge') {
        if (msg.proto !== HANDSHAKE_PROTO) { onAuthFailure('proto-mismatch'); return; }
        if (!KEY) { onAuthFailure('invalid-key'); return; }
        let nonce;
        try { nonce = makeNonce(); } catch (e) { onAuthFailure('no-random'); return; }
        pendingNonce = nonce;
        pendingChallenge = { nonce: msg.nonce, port: msg.port };
        const proof = hmacSha256Hex(KEY, HANDSHAKE_PREFIX + '|plugin|' + msg.nonce + '|'
          + nonce + '|' + msg.port + '|' + PLUGIN_VERSION);
        try {
          ws.send(JSON.stringify({
            type: 'hello', proto: HANDSHAKE_PROTO, mode: 'plugin',
            version: PLUGIN_VERSION, capabilities: ['render-plan-v1', 'render-plan-batch-v1'], nonce, proof,
          }));
        } catch (e) {}
        return;
      }

      // --- Handshake step 2: the daemon proves itself back ---
      if (msg.type === 'hello-ack') {
        // Until this verifies, whoever answered is just "something on a local
        // port". Accepting eval frames from it was the inverse of the key-leak
        // gap: a fake daemon could drive the document without knowing the key.
        if (!pendingChallenge || !pendingNonce) { onAuthFailure('daemon-proof'); return; }
        const want = hmacSha256Hex(KEY, HANDSHAKE_PREFIX + '|daemon|' + pendingNonce + '|'
          + pendingChallenge.nonce + '|' + pendingChallenge.port);
        if (!proofEquals(want, msg.proof || '')) { onAuthFailure('daemon-proof'); return; }
        pendingNonce = null;
        pendingChallenge = null;

        authed = true;
        okCount = 0; errCount = 0; renderStats();
        setStatus(paused ? 'Paused' : 'Connected', paused ? 'paused' : 'connected');
        hintEl.textContent = paused
          ? 'Agent commands are being rejected. Press Resume to continue.'
          : DEFAULT_HINT;
        hintEl.classList.remove('warn');
        restConfigured = !!msg.restTokenConfigured;
        renderRestStatus();
        parent.postMessage({ pluginMessage: { type: 'connected' } }, '*');
        startKeepalive();
        return;
      }
      if (msg.type === 'auth-error') {
        onAuthFailure(msg.reason);
        return;
      }
      if (msg.type === 'superseded') {
        onSuperseded();
        return;
      }

      // Nothing below runs on an unauthenticated socket: an unproven peer gets
      // no eval, no batch, not even a pong to measure us by.
      if (!authed) return;

      if (msg.type === 'rest-token-ack') {
        restConfigured = !!msg.configured;
        renderRestStatus();
        restStatusEl.textContent = msg.error
          ? 'Failed: ' + msg.error
          : (restConfigured ? 'Token saved ✓ — stored on this machine only.' : 'Token cleared ✓');
        return;
      }

      if (msg.action === 'eval') {
        if (paused) { rejectPaused(msg); return; }
        addLog({ id: msg.id, t0: Date.now(), label: evalLabel(msg.code || ''), kind: WRITE_RE.test(msg.code || '') ? 'write' : 'read' });
        parent.postMessage({ pluginMessage: { type: 'eval', id: msg.id, code: msg.code } }, '*');
      }
      if (msg.action === 'render-plan') {
        if (paused) { rejectPaused(msg); return; }
        const name = msg.plan && msg.plan.root && msg.plan.root.name ? msg.plan.root.name : 'Frame';
        addLog({ id: msg.id, t0: Date.now(), label: 'render plan · ' + name, kind: 'write' });
        parent.postMessage({ pluginMessage: { type: 'render-plan', id: msg.id, plan: msg.plan } }, '*');
      }
      if (msg.action === 'render-plan-batch') {
        if (paused) { rejectPaused(msg); return; }
        const n = (msg.plans || []).length;
        addLog({ id: msg.id, t0: Date.now(), label: 'render plan batch · ' + n + ' frame' + (n !== 1 ? 's' : ''), kind: 'write' });
        parent.postMessage({ pluginMessage: { type: 'render-plan-batch', id: msg.id, plans: msg.plans, options: msg.options || {} } }, '*');
      }
      if (msg.action === 'eval-batch') {
        if (paused) { rejectPaused(msg); return; }
        const n = (msg.codes || []).length;
        addLog({ id: msg.id, t0: Date.now(), label: 'batch · ' + n + ' step' + (n !== 1 ? 's' : ''), kind: 'write' });
        parent.postMessage({ pluginMessage: { type: 'eval-batch', id: msg.id, codes: msg.codes } }, '*');
      }
      if (msg.action === 'ping') {
        ws.send(JSON.stringify({ type: 'pong', id: msg.id }));
      }
      if (msg.type === 'pong') {
        lastPong = Date.now();
        if (lastPingSent) { latencyMs = Date.now() - lastPingSent; setConnMeta(); }
      }
    }

    function handleClose(event) {
      // 4409 = displaced by another Figma window (the superseded message may
      // have been missed if the close raced it). No auto-reconnect.
      if (superseded || (event && event.code === 4409)) {
        onSuperseded();
        return;
      }
      // Daemon rejects unauthenticated sockets with close code 4401.
      if (event && event.code === 4401) {
        // Reason arrived (or not) via the auth-error message just before the
        // close; if it did, onAuthFailure already ran and tore down `ws`.
        if (ws) onAuthFailure('invalid-key');
        return;
      }
      if (ws && ws.readyState !== WebSocket.OPEN) {
        ws = null;
        authed = false;
        connectedPort = null;
        latencyMs = null;
        setConnMeta();
        setStatus('Reconnecting…', 'connecting');
        stopKeepalive();
        parent.postMessage({ pluginMessage: { type: 'disconnected' } }, '*');
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectParallel, 200);
      }
    }

    function startKeepalive() {
      stopKeepalive();
      lastPong = Date.now();
      keepaliveTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          if (Date.now() - lastPong > 8000) { ws.close(); return; }
          lastPingSent = Date.now();
          ws.send(JSON.stringify({ type: 'ping' }));
        }
      }, 3000);
    }
    function stopKeepalive() {
      if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null; }
    }

    // Messages from the plugin main thread (eval results + key bridge)
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'key') {
        KEY = (msg.value || '').trim() || null;
        if (KEY) {
          showKeyPanel(false);
          connectParallel();
        } else {
          setStatus('Enter your access key', 'error');
          showKeyPanel(true);
        }
        return;
      }
      if (msg.type === 'key-saved') {
        if (msg.error) {
          // The key works for THIS session (it is in memory) but was not
          // persisted — after a plugin restart it will be gone.
          hintEl.textContent = 'Warning: key not persisted (' + msg.error + ') — it will be asked again next time.';
          hintEl.classList.add('warn');
        }
        return;
      }

      if (msg.type === 'result') {
        finishLog(msg.id, msg.error);
        if (ws && ws.readyState === WebSocket.OPEN && authed) {
          ws.send(JSON.stringify({ type: 'result', id: msg.id, result: msg.result, error: msg.error, metadata: msg.metadata }));
        }
      }
      if (msg.type === 'batch-result') {
        const fails = (msg.results || []).filter(r => r && r.success === false);
        finishLog(msg.id, fails.length ? (fails.length + ' step(s) failed: ' + (fails[0].error || '')) : null,
          (msg.results || []).length + ' done');
        if (ws && ws.readyState === WebSocket.OPEN && authed) {
          ws.send(JSON.stringify({ type: 'batch-result', id: msg.id, results: msg.results }));
        }
      }

      // Selection snapshot from the main thread (automatic, debounced):
      // show it in the UI and forward it to the daemon so the MCP tool
      // figma_selection can read it. Not logged — auto-pushes would spam
      // the activity log.
      if (msg.type === 'selection-snapshot') {
        renderSelection(msg.selection);
        if (ws && ws.readyState === WebSocket.OPEN && authed) {
          ws.send(JSON.stringify({ type: 'selection', selection: msg.selection, ts: Date.now() }));
        }
      }

      if (msg.type === 'version-saved') {
        if (msg.error) showError('Saving the version failed: ' + msg.error);
        else addLog({ id: 'vd' + Date.now(), t0: Date.now(), label: 'version saved ✓', kind: 'meta', status: 'ok', ms: 0 });
      }
    };

    // Boot: size the window, show the REST state (the field is always
    // reachable now, connected or not), then fetch the key and connect.
    syncSize();
    renderRestStatus();
    requestKey();
  </script>
</body>
</html>
